version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: medispring-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medispring
      MYSQL_USER: medispring
      MYSQL_PASSWORD: medispring123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: medispring-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://medispring:medispring123@mysql:3306/medispring
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: change_this_in_production_please
      JWT_REFRESH_SECRET: change_this_refresh_secret_too
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/src/uploads
      - logs_data:/app/logs
    command: >
      sh -c "npx prisma migrate deploy && node src/server.js"

volumes:
  mysql_data:
  uploads_data:
  logs_data:
